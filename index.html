<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidah — Latihan Bicara &amp; Dengar Bahasa Inggris</title>
<style>
  :root{
    --paper: #EEEAE0;
    --paper2: #F8F6F0;
    --ink: #262320;
    --ink-soft: #58524A;
    --line: #D9D2C0;
    --accent: #2B6E64;
    --accent-soft: #DCE9E5;
    --amber: #C9862B;
    --amber-soft: #F3E4CB;
    --good: #3F7D5C;
    --good-soft: #E1EEE5;
    --shadow: 0 1px 0 rgba(38,35,32,0.06), 0 8px 24px rgba(38,35,32,0.08);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: var(--paper); color: var(--ink); font-family: var(--sans); min-height:100vh; }
  #app{ max-width: 760px; margin: 0 auto; padding: 40px 16px 80px; }

  .hero{ text-align:center; margin-bottom: 36px; }
  .hero h1{ font-family: var(--serif); font-weight:normal; font-size: 34px; margin: 0 0 6px; }
  .hero p{ color: var(--ink-soft); font-size: 14px; margin:0; }

  .card{
    background: var(--paper2); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 14px;
    display:flex; align-items:center; gap:18px; text-decoration:none; color: inherit;
    transition: transform .12s ease;
  }
  .card.available:hover{ transform: translateY(-2px); }
  .card.locked{ opacity: .55; cursor: default; }

  .badge{
    width: 56px; height:56px; border-radius: 50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--serif); font-size: 20px; font-weight:bold;
    background: var(--accent-soft); color: var(--accent);
  }
  .card.locked .badge{ background:#EAE7DE; color:#B4AB9B; }

  .info{ flex:1; }
  .info .title{ font-family: var(--serif); font-size: 19px; margin-bottom:2px; }
  .info .subtitle{ font-size: 12.5px; color: var(--ink-soft); }
  .info .stat{ font-size: 12px; color: var(--accent); margin-top:6px; }

  .status{
    font-size: 11px; padding: 4px 10px; border-radius: 14px; white-space:nowrap;
    background: var(--good-soft); color: var(--good); font-weight:600;
  }
  .status.soon{ background: var(--amber-soft); color: var(--amber); }

  .footer-note{ text-align:center; font-size: 12px; color: var(--ink-soft); margin-top: 30px; line-height:1.6; }
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <h1>Lidah</h1>
    <p>Latihan bicara &amp; dengar bahasa Inggris — dengar, tirukan, dapatkan koreksi</p>
  </div>
  <div id="cards"></div>
  <div class="footer-note">
    Setiap "Kemampuan" adalah program mandiri (20 level, 1000 kata) — selesaikan salah satu sebelum lanjut ke berikutnya.<br>
    Progres tersimpan otomatis di browser ini per Kemampuan.
  </div>
</div>
<script>
const KEMAMPUAN = [
  { id:1, file:'lidah-A1-level1-20.html', cefr:'A1', label:'Pemula', levels:'Level 1–20', storageKey:'lidah_a1_progress_v1', available:true },
  { id:2, file:'lidah-A2-level21-40.html', cefr:'A2', label:'Dasar', levels:'Level 21–40', storageKey:'lidah_a2_progress_v1', available:false },
  { id:3, file:'lidah-B1-level41-60.html', cefr:'B1', label:'Menengah', levels:'Level 41–60', storageKey:'lidah_b1_progress_v1', available:false },
  { id:4, file:'lidah-B2-level61-80.html', cefr:'B2', label:'Menengah Atas', levels:'Level 61–80', storageKey:'lidah_b2_progress_v1', available:false },
  { id:5, file:'lidah-C1-level81-100.html', cefr:'C1', label:'Mahir', levels:'Level 81–100', storageKey:'lidah_c1_progress_v1', available:false },
];

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function progressStat(storageKey){
  try{
    const raw = localStorage.getItem(storageKey);
    if(!raw) return null;
    const state = JSON.parse(raw);
    const doneTasks = Object.values(state.taskDone || {}).filter(Boolean).length;
    const masteredWords = Object.values(state.mastery || {}).filter(m => m.correct > 0).length;
    return { doneTasks, masteredWords };
  }catch(e){ return null; }
}

function render(){
  const container = document.getElementById('cards');
  container.innerHTML = KEMAMPUAN.map(k => {
    const stat = k.available ? progressStat(k.storageKey) : null;
    const statLine = stat
      ? (stat.doneTasks + ' tugas selesai · ' + stat.masteredWords + ' kata dikuasai')
      : (k.available ? 'Belum ada progres' : '');
    const cls = k.available ? 'card available' : 'card locked';
    const inner =
      '<div class="badge">' + esc(k.cefr) + '</div>' +
      '<div class="info"><div class="title">Kemampuan ' + k.id + ' — ' + esc(k.label) + '</div>' +
      '<div class="subtitle">' + esc(k.levels) + ' · 1000 kata target</div>' +
      (statLine ? '<div class="stat">' + esc(statLine) + '</div>' : '') + '</div>' +
      '<div class="status ' + (k.available ? '' : 'soon') + '">' + (k.available ? 'Tersedia' : 'Segera hadir') + '</div>';
    return k.available
      ? '<a class="' + cls + '" href="' + esc(k.file) + '">' + inner + '</a>'
      : '<div class="' + cls + '">' + inner + '</div>';
  }).join('');
}
render();
</script>
</body>
</html>
