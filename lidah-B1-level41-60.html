<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelajarInggris.id B1 — Latihan Bicara &amp; Dengar (Level 41-60)</title>
<style>
  :root{
    --paper: #EEEAE0;
    --paper2: #F8F6F0;
    --ink: #262320;
    --ink-soft: #58524A;
    --line: #D9D2C0;
    --accent: #2B6E64;
    --accent-soft: #DCE9E5;
    --amber: #C9862B;
    --amber-soft: #F3E4CB;
    --good: #3F7D5C;
    --good-soft: #E1EEE5;
    --bad: #B5533C;
    --bad-soft: #F5E2DB;
    --shadow: 0 1px 0 rgba(38,35,32,0.06), 0 8px 24px rgba(38,35,32,0.08);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    min-height:100vh;
  }
  #app{ max-width: 880px; margin: 0 auto; padding: 20px 16px 80px; }

  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 6px 2px 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
  }
  .brand{ font-family: var(--serif); font-size: 26px; letter-spacing: 0.3px; }
  .brand small{ display:block; font-family: var(--sans); font-size: 11px; color: var(--ink-soft); letter-spacing: 1.5px; text-transform: uppercase; margin-top:2px;}
  .streakline{ font-size: 13px; color: var(--ink-soft); text-align:right; }
  .streakline b{ color: var(--accent); }

  .card{
    background: var(--paper2);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* ---- Level map: index-card / catalog look ---- */
  .catalog{ display:flex; flex-direction:column; gap:10px; }
  .lvl-row{
    display:flex; align-items:stretch; gap:0;
    border: 1px solid var(--line); border-radius: 10px; overflow:hidden;
    background: var(--paper2);
  }
  .lvl-tab{
    width: 68px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--serif); font-size: 26px;
    background: var(--accent-soft); color: var(--accent);
    border-right: 1px solid var(--line);
  }
  .lvl-tab.done{ background: var(--good-soft); color: var(--good); }
  .lvl-tab.locked{ background: #EAE7DE; color: #B4AB9B; }
  .lvl-body{ flex:1; padding: 12px 14px; }
  .lvl-title{ font-size: 14px; color: var(--ink-soft); margin-bottom:8px; display:flex; justify-content:space-between; }
  .lvl-title b{ color: var(--ink); font-weight:600; }
  .tasks{ display:flex; gap:6px; flex-wrap:wrap; }
  .task-pill{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight:600; cursor:pointer; user-select:none;
    border: 1.5px solid var(--line); background: var(--paper); color: var(--ink-soft);
    transition: transform .12s ease;
  }
  .task-pill.review{ border-radius: 8px; width:auto; padding: 0 10px; font-size:11px; }
  .task-pill.available{ border-color: var(--accent); color: var(--accent); background: var(--paper2); }
  .task-pill.available:hover{ transform: translateY(-2px); }
  .task-pill.done{ background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .task-pill.locked{ opacity:.45; cursor:default; }
  .task-pill.current{ box-shadow: 0 0 0 3px var(--amber-soft); border-color: var(--amber); color: var(--amber); }

  .bonus-row{ display:flex; justify-content:center; margin: 2px 0 8px; }
  .bonus-pill{
    font-size: 12px; padding: 6px 14px; border-radius: 20px;
    border: 1.5px dashed var(--amber); color: var(--amber); cursor:pointer; background: var(--amber-soft);
  }

  /* ---- Practice screen ---- */
  .practice-wrap{ display:flex; flex-direction:column; gap:16px; }
  .practice-head{ display:flex; align-items:center; justify-content:space-between; }
  .back-link{ font-size:13px; color: var(--ink-soft); cursor:pointer; text-decoration:underline; }
  .progress-track{ height:6px; background: var(--line); border-radius:4px; overflow:hidden; margin: 8px 0 18px;}
  .progress-fill{ height:100%; background: var(--accent); transition: width .25s ease; }

  .sentence-card{ padding: 28px 26px; text-align:center; }
  .sentence-en{ font-family: var(--serif); font-size: 28px; line-height:1.4; }
  .sentence-en .w{ padding: 0 1px; border-radius:4px; }
  .sentence-en .w.good{ background: var(--good-soft); color: var(--good); }
  .sentence-en .w.bad{ background: var(--bad-soft); color: var(--bad); }
  .sentence-ipa{ font-family: var(--mono); color: var(--ink-soft); font-size: 14px; margin-top:10px; letter-spacing:.3px;}
  .sentence-id{ margin-top: 14px; font-size: 15px; color: var(--ink-soft); }
  .reveal-btn{ font-size:12px; color: var(--accent); cursor:pointer; text-decoration:underline; margin-top:10px; display:inline-block;}

  .controls{ display:flex; gap:12px; justify-content:center; margin-top:22px; flex-wrap:wrap;}
  .btn{
    font-family: var(--sans); font-size: 14px; font-weight:600; padding: 11px 20px;
    border-radius: 8px; border: 1.5px solid var(--ink); background: var(--paper2); color: var(--ink);
    cursor:pointer;
  }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost{ border-color: var(--line); color: var(--ink-soft); }
  .btn.rec{ border-color: var(--bad); color: var(--bad); }
  .btn.rec.recording{ background: var(--bad); color:#fff; }

  .feedback{ margin-top: 18px; padding: 16px; border-radius:8px; background: var(--paper); border:1px solid var(--line); text-align:left; }
  .feedback .score{ font-family: var(--serif); font-size: 20px; margin-bottom:6px; }
  .tip-row{ font-size: 13px; margin-top:6px; color: var(--ink-soft); }
  .tip-row b{ color: var(--bad); }
  .ai-explain{ font-size:12px; color:var(--accent); text-decoration:underline; cursor:pointer; margin-left:6px;}
  .ai-explain-text{ font-size:13px; margin-top:6px; color:var(--ink-soft); font-style:italic; }

  .summary{ text-align:center; padding: 30px 24px; }
  .summary h2{ font-family: var(--serif); font-weight:normal; font-size:24px; margin:0 0 8px;}
  .mastery-bar{ height:10px; background: var(--line); border-radius:6px; overflow:hidden; margin: 14px auto; max-width:320px;}
  .mastery-fill{ height:100%; background: var(--good); }
  .word-chip{ display:inline-block; margin:3px; padding:4px 10px; border-radius:14px; font-size:12px; }
  .word-chip.ok{ background: var(--good-soft); color:var(--good); }
  .word-chip.miss{ background: var(--bad-soft); color:var(--bad); }

  .notice{ font-size:13px; color: var(--ink-soft); background: var(--amber-soft); border:1px solid var(--amber); border-radius:8px; padding:10px 14px; margin-bottom:16px; }
  .error-box{ font-size:13px; color: var(--bad); background: var(--bad-soft); border:1px solid var(--bad); border-radius:8px; padding:12px 14px; margin-top:14px; }
  .loading{ text-align:center; padding: 60px 20px; color: var(--ink-soft); font-family: var(--serif); font-size:18px;}

  .footer-note{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:30px; }

  @media (max-width: 560px){
    .sentence-en{ font-size: 22px; }
    .lvl-tab{ width:52px; font-size:20px; }
  }
</style>

function sampleWords(words, n){
  const copy = words.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(n, copy.length));
}


// ====== NORMALISASI KATA & SCORING ======
function normalizeWord(w){ return (w || '').toLowerCase().replace(/[^a-z']/g, ''); }
function baseForm(w){
  w = normalizeWord(w);
  if(w.length > 4){
    if(w.endsWith('ies')) return w.slice(0, -3) + 'y';

    if(w.endsWith('ed')) return w.slice(0, -2);
  }
  return w;
}

  const saidWords = (transcript || '').split(/\s+/).map(normalizeWord).filter(Boolean);
  const saidBase = saidWords.map(baseForm);
  const results = targetWords.map(tw => ({ word: tw, matched: saidBase.includes(baseForm(tw)) }));
  const matchedCount = results.filter(r => r.matched).length;
  const score = targetWords.length ? Math.round((matchedCount / targetWords.length) * 100) : 0;
  return { results, score };
}

// ====== TIPS PENGUCAPAN (heuristik pola umum penutur Indonesia) ======
const TIP_PATTERNS = [
  { test: w => /th/.test(w), tip: "Bunyi 'th' sering diganti jadi 's' atau 'd'. Jepit lidah tipis di antara gigi depan atas-bawah, lalu keluarkan udara lembut." },
  { test: w => /^v/.test(w), tip: "Huruf 'v' di awal sering kedengaran seperti 'f'/'p'. Gigit bibir bawah dengan gigi atas, lalu keluarkan suara bergetar (bukan cuma hembusan udara)." },
  { test: w => /^(sh|ch)/.test(w), tip: "'sh' dan 'ch' di awal kata sering tertukar. 'sh' seperti 'sy' (syur), 'ch' seperti 'c' di kata 'cek'." },
  { test: w => /r/.test(w), tip: "Huruf 'r' bahasa Inggris tidak digulung seperti bahasa Indonesia — lebih pendek dan halus, lidah tidak menyentuh langit-langit." },
  { test: w => /(ee|ea|ip$|it$|ill$)/.test(w), tip: "Perhatikan panjang-pendek vokal (mis. 'ship' vs 'sheep') — vokal panjang ditahan sedikit lebih lama." },
  { test: w => /[bcdfgkpt]$/.test(w), tip: "Konsonan di akhir kata sering hilang saat diucapkan. Coba tekan sedikit lebih jelas di akhir, jangan digantung." },
];
function tipFor(word){
  for(const p of TIP_PATTERNS){ if(p.test(word)) return p.tip; }
  return null;
}

// ====== TEXT-TO-SPEECH ======
let cachedVoice = null;
function pickVoice(){
  if(cachedVoice) return cachedVoice;
  const voices = speechSynthesis.getVoices();
  cachedVoice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.startsWith('en')) || null;
  return cachedVoice;
}
if(typeof speechSynthesis !== 'undefined'){
  speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
}
// Chrome menidurkan mesin TTS setelah idle beberapa detik, membuat ucapan pertama
// terpotong di awal. "Detak jantung" ini membangunkan mesin secara berkala selama
// halaman terbuka, supaya ucapan pertama pun selalu utuh.
if(typeof speechSynthesis !== 'undefined'){
  setInterval(() => {
    if(!speechSynthesis.speaking){
      speechSynthesis.pause();
      speechSynthesis.resume();
    }
  }, 5000);
}
function speak(text, rate){
  if(typeof speechSynthesis === 'undefined'){ alert('Browser ini tidak mendukung text-to-speech.'); return; }
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if(v) u.voice = v;
    u.lang = 'en-US';
    u.rate = rate || 1;
    speechSynthesis.speak(u);
  }, 150);
}

// ====== SPEECH-TO-TEXT ======
function getRecognition(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R) return null;
  const r = new R();
  r.lang = 'en-US';
  r.interimResults = false;
  r.maxAlternatives = 1;
  return r;
}
const SPEECH_SUPPORTED = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

function esc(s){ return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ====== STATE & STORAGE (localStorage, karena dijalankan via server lokal) ======
const STORAGE_KEY = 'lidah_b1_progress_v1';
let state = { mastery: {}, taskDone: {}, reviewDone: [] };

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ console.error('Gagal memuat progres tersimpan', e); }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Gagal menyimpan progres', e); }
}

function taskKey(levelIdx, taskIdx){ return 'L'+levelIdx+'T'+taskIdx; }
function isLevelUnlocked(levelIdx){
  if(levelIdx === 0) return true;
  return !!state.taskDone[taskKey(levelIdx - 1, 5)];
}
function isTaskUnlocked(levelIdx, taskIdx){
  if(!isLevelUnlocked(levelIdx)) return false;
  if(taskIdx === 0) return true;
  return !!state.taskDone[taskKey(levelIdx, taskIdx - 1)];
}
function isTaskDone(levelIdx, taskIdx){ return !!state.taskDone[taskKey(levelIdx, taskIdx)]; }

// ====== NORMALISASI & TIPS (dipakai bersama dari a1_part2.js: baseForm, scoreSentence, tipFor, speak, getRecognition, SPEECH_SUPPORTED) ======

// ====== ALUR TUGAS / LEVEL (data statis, tidak ada network call) ======
let screen = 'map';
let session = null;

function startTask(levelIdx, taskIdx){
  if(!isTaskUnlocked(levelIdx, taskIdx)) return;
  const level = getLevel(levelIdx);
  const isReview = taskIdx === 5;
  const task = level.tasks[taskIdx];
  screen = 'practice';
  session = {
    levelIdx, taskIdx, isReview, isMixedReview:false,
    words: task.words, sentences: task.sentences.slice(),
    current: 0, results: [], showTranslation:false,
    lastResult:null, lastScore:null, lastTranscript:null, recording:false, recError:null
  };
  render();
}

function startReview(checkpoint){
  const allWordsSoFar = [];
  for(let i = 0; i < checkpoint; i++){ allWordsSoFar.push(...LEVELS[i].words); }
  const words = sampleWords(allWordsSoFar, 20);
  // susun kalimat dari task.sentences level-level terkait yang mengandung kata-kata terpilih
  const pool = [];
  for(let i = 0; i < checkpoint; i++){
    LEVELS[i].tasks.forEach(t => pool.push(...t.sentences));
  }
  const wordSet = new Set(words.map(w => baseForm(w)));
  let sentences = pool.filter(s => wordSet.has(baseForm(s.word)));
  if(sentences.length === 0) sentences = sampleWords(pool, 15);
  sentences = sampleWords(sentences, Math.min(20, sentences.length));
  screen = 'practice';
  session = {
    isReview:true, isMixedReview:true, checkpoint, words,
    sentences, current:0, results:[], showTranslation:false,
    lastResult:null, lastScore:null, lastTranscript:null, recording:false, recError:null
  };
  render();
}

function currentSentence(){ return session.sentences[session.current]; }
function doListen(rate){ speak(currentSentence().en, rate); }

function doRecord(){
  const rec = getRecognition();
  if(!rec){ alert('Browser ini tidak mendukung pengenalan suara (Speech Recognition). Gunakan Google Chrome.'); return; }
  session.recording = true;
  session.recError = null;
  clearRecordedAudio();
  render();

  // Rekam audio paralel (untuk diputar ulang) menggunakan MediaRecorder, terpisah dari speech recognition
  if(!IS_MOBILE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      session._stream = stream;
      const mr = new MediaRecorder(stream);
      session._chunks = [];
      mr.ondataavailable = e => { if(e.data && e.data.size > 0) session._chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(session._chunks, { type: mr.mimeType || 'audio/webm' });
        session.lastAudioUrl = URL.createObjectURL(blob);
        stream.getTracks().forEach(t => t.stop());
        render();
      };
      session._mediaRecorder = mr;
      mr.start();
    }).catch(() => { /* mic untuk playback gagal, tetap lanjut pakai speech recognition saja */ });
  }

  rec.onresult = (ev) => { handleResult(ev.results[0][0].transcript); };
  rec.onerror = (ev) => { session.recording = false; session.recError = 'Gagal merekam (' + ev.error + '). Coba lagi.'; stopMediaRecorder(); render(); };
  rec.onend = () => { session.recording = false; stopMediaRecorder(); };
  try{ rec.start(); }catch(e){ session.recording = false; render(); }
}

function stopMediaRecorder(){
  if(session._mediaRecorder && session._mediaRecorder.state !== 'inactive'){
    try{ session._mediaRecorder.stop(); }catch(e){}
  }
}

function clearRecordedAudio(){
  if(session.lastAudioUrl){ URL.revokeObjectURL(session.lastAudioUrl); }
  session.lastAudioUrl = null;
  session._chunks = [];
}

function playMyRecording(){
  if(session.lastAudioUrl){ new Audio(session.lastAudioUrl).play(); }
}

function handleResult(transcript){
  const target = currentSentence().en;
  const { results, score } = scoreSentence(target, transcript);
  session.lastTranscript = transcript;
  session.lastResult = results;
  session.lastScore = score;
  session.recording = false;

  const targetSet = new Set(session.words.map(w => baseForm(w)));
  results.forEach(r => {
    const b = baseForm(r.word);
    if(targetSet.has(b)){
      if(!state.mastery[b]) state.mastery[b] = { seen:0, correct:0 };
      state.mastery[b].seen += 1;
      if(r.matched) state.mastery[b].correct += 1;
    }
  });
  session.results[session.current] = { transcript, score, results };
  saveState();
  render();
}

function toggleTranslation(){ session.showTranslation = !session.showTranslation; render(); }

function nextSentence(){
  session.lastResult = null; session.lastScore = null; session.lastTranscript = null; session.recError = null; session.showTranslation = false;
  clearRecordedAudio();
  if(session.current < session.sentences.length - 1){
    session.current += 1;
    render();
  }else{
    finishTask();
  }
}

function finishTask(){
  const uniqueBase = Array.from(new Set(session.words.map(w => baseForm(w))));
  const masteredCount = uniqueBase.filter(b => state.mastery[b] && state.mastery[b].correct > 0).length;
  const pct = uniqueBase.length ? masteredCount / uniqueBase.length : 1;
  session.finalMasteryPct = pct;
  session.masteredList = uniqueBase.map(b => ({
    word: session.words.find(w => baseForm(w) === b) || b,
    ok: !!(state.mastery[b] && state.mastery[b].correct > 0)
  }));
  screen = 'summary';
  render();
}

function markTaskDoneAndContinue(){
  if(session.isMixedReview){
    if(!state.reviewDone.includes(session.checkpoint)) state.reviewDone.push(session.checkpoint);
    saveState();
    screen = 'map'; session = null; render();
    return;
  }
  state.taskDone[taskKey(session.levelIdx, session.taskIdx)] = true;
  saveState();
  screen = 'map'; session = null; render();
}

function extraPractice(){
  const missing = session.masteredList.filter(m => !m.ok).map(m => m.word);
  if(missing.length === 0){ markTaskDoneAndContinue(); return; }
  // ambil ulang kalimat yang mengandung kata-kata yang belum dikuasai dari pool level terkait (atau semua level jika review campuran)
  let pool = [];
  if(session.isMixedReview){
    for(let i = 0; i < session.checkpoint; i++){ LEVELS[i].tasks.forEach(t => pool.push(...t.sentences)); }
  }else{
    pool = getLevel(session.levelIdx).tasks[session.taskIdx].sentences.concat(getLevel(session.levelIdx).tasks[5].sentences);
  }
  const missSet = new Set(missing.map(w => baseForm(w)));
  let extra = pool.filter(s => missSet.has(baseForm(s.word)));
  if(extra.length === 0){ markTaskDoneAndContinue(); return; }
  extra = sampleWords(extra, Math.min(10, extra.length));
  session.sentences = session.sentences.concat(extra);
  session.current = session.sentences.length - extra.length;
  session.lastResult = null; session.lastScore = null;
  screen = 'practice';
  render();
}

function backToMap(){ screen = 'map'; session = null; render(); }

// ====== RENDER ======
function renderMap(){
  let rows = '';
  for(let i = 0; i < LEVELS.length; i++){
    const level = getLevel(i);
    const unlocked = isLevelUnlocked(i);
    const doneCount = [0,1,2,3,4,5].filter(t => isTaskDone(i, t)).length;
    const levelDone = doneCount === 6;
    const tabClass = levelDone ? 'done' : (unlocked ? '' : 'locked');
    let taskPills = '';
    for(let t = 0; t < 6; t++){
      const label = t < 5 ? (t + 1) : 'U';
      const cls = ['task-pill'];
      if(t === 5) cls.push('review');
      if(isTaskDone(i, t)) cls.push('done');
      else if(isTaskUnlocked(i, t)) cls.push('available');
      else cls.push('locked');
      const clickable = isTaskUnlocked(i, t);
      const onclick = clickable ? ('onclick="startTask(' + i + ',' + t + ')"') : '';
      taskPills += '<div class="' + cls.join(' ') + '" ' + onclick + '>' + label + '</div>';
    }
    rows += '<div class="lvl-row"><div class="lvl-tab ' + tabClass + '">' + level.num + '</div>' +
      '<div class="lvl-body"><div class="lvl-title"><span><b>Level ' + level.num + '</b> · ' + level.words.length + ' kata baru</span>' +
      '<span>' + doneCount + '/6 tugas</span></div><div class="tasks">' + taskPills + '</div></div></div>';
    if(levelDone && (level.num % REVIEW_EVERY === 0)){
      const checkpoint = level.num;
      const rdone = state.reviewDone.includes(checkpoint);
      rows += '<div class="bonus-row"><div class="bonus-pill" onclick="startReview(' + checkpoint + ')">🔀 ' + (rdone ? 'Ulangi ' : '') + 'Review Campuran (level 1–' + checkpoint + ')</div></div>';
    }
  }
  const totalMastered = Object.values(state.mastery).filter(m => m.correct > 0).length;
  const totalWords = LEVELS.reduce((a, l) => a + l.words.length, 0);
  return '<a href="index.html" style="display:inline-block;font-size:13px;color:var(--ink-soft);text-decoration:none;margin-bottom:14px;">&larr; Kembali ke Beranda</a>' +
    '<div class="topbar"><div class="brand">BelajarInggris.id — B1<small>Level 41–60 · Menengah</small></div>' +
    '<div class="streakline"><b>' + totalMastered + '</b> / ' + totalWords + ' kata dikuasai</div></div>' +
    (!SPEECH_SUPPORTED ? '<div class="notice">Browser ini sepertinya tidak mendukung pengenalan suara. Gunakan Google Chrome untuk hasil terbaik.</div>' : '') +
    '<div class="catalog">' + rows + '</div>' +
    '<div class="footer-note">1 tugas ≈ 10 kata baru. Disarankan 1–3 tugas/hari agar konsisten. Progres tersimpan di browser ini.</div>';
}

function renderPractice(){
  const total = session.sentences.length;
  const s = currentSentence();
  const pct = Math.round((session.current / total) * 100);
  const hasResult = !!session.lastResult;
  let sentenceHtml = esc(s.en);
  if(hasResult){
    const words = s.en.split(/\s+/);
    sentenceHtml = words.map(w => {
      const nb = baseForm(w);
      const r = session.lastResult.find(rr => baseForm(rr.word) === nb);
      const cls = r ? (r.matched ? 'good' : 'bad') : '';
      return '<span class="w ' + cls + '">' + esc(w) + '</span>';
    }).join(' ');
  }
  let tipsHtml = '';
  if(hasResult){
    const badWords = session.lastResult.filter(r => !r.matched);
    tipsHtml = badWords.map(r => {
      const tip = tipFor(r.word);
      return '<div class="tip-row"><b>' + esc(r.word) + '</b>: ' + (tip ? esc(tip) : 'Coba dengar ulang & tiru pelan-pelan.') + '</div>';
    }).join('');
  }
  return '<div class="practice-wrap"><div class="practice-head">' +
    '<span class="back-link" onclick="backToMap()">&larr; Kembali ke peta level</span>' +
    '<span style="font-size:13px;color:var(--ink-soft)">Kalimat ' + (session.current + 1) + '/' + total + '</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="sentence-card card"><div class="sentence-en">' + sentenceHtml + '</div>' +
    '<div class="sentence-ipa">Kata kunci: ' + esc(s.word) + ' /' + esc(s.wordIpa) + '/</div>' +
    '<div><span class="reveal-btn" onclick="toggleTranslation()">' + (session.showTranslation ? 'Sembunyikan arti' : 'Lihat arti') + '</span></div>' +
    (session.showTranslation ? '<div class="sentence-id">' + esc(s.id) + '</div>' : '') +
    '<div class="controls"><button class="btn" onclick="doListen(1)">🔊 Dengar</button>' +
    '<button class="btn ghost" onclick="doListen(0.7)">🐢 Pelan</button>' +
    '<button class="btn rec ' + (session.recording ? 'recording' : '') + '" onclick="doRecord()" ' + (session.recording ? 'disabled' : '') + '>' +
    (session.recording ? '● Merekam...' : '🎤 Tirukan') + '</button></div>' +
    (session.recError ? '<div class="error-box">' + esc(session.recError) + '</div>' : '') +
    (hasResult ? '<div class="feedback"><div class="score">Skor: ' + session.lastScore + '%</div>' +
      (session.lastAudioUrl ? '<button class="btn ghost" style="margin-bottom:8px" onclick="playMyRecording()">▶ Putar Rekaman Saya</button>' : '') +
      (tipsHtml || '<div class="tip-row" style="color:var(--good)">Semua kata dikenali dengan baik! 👍</div>') +
      '<button class="btn primary" style="margin-top:12px" onclick="nextSentence()">' + (session.current < total - 1 ? 'Lanjut Kalimat →' : 'Selesai Tugas →') + '</button></div>' : '') +
    '</div></div>';
}

function renderSummary(){
  const pct = Math.round(session.finalMasteryPct * 100);
  const passed = session.finalMasteryPct >= MASTERY_THRESHOLD;
  const chips = session.masteredList.map(m => '<span class="word-chip ' + (m.ok ? 'ok' : 'miss') + '">' + esc(m.word) + '</span>').join('');
  return '<div class="summary card"><h2>' + (passed ? 'Tugas Selesai! 🎉' : 'Hampir Sampai') + '</h2>' +
    '<div>' + pct + '% kata dikuasai (target ' + Math.round(MASTERY_THRESHOLD * 100) + '%)</div>' +
    '<div class="mastery-bar"><div class="mastery-fill" style="width:' + pct + '%"></div></div>' +
    '<div>' + chips + '</div><div class="controls">' +
    (passed ? '<button class="btn primary" onclick="markTaskDoneAndContinue()">Lanjut' + (session.isMixedReview ? ' (Kembali ke Peta)' : '') + '</button>'
             : '<button class="btn primary" onclick="extraPractice()">Latihan Tambahan (kata belum dikuasai)</button>' +
               '<button class="btn ghost" onclick="markTaskDoneAndContinue()">Lewati &amp; Tetap Lanjut</button>') +
    '</div></div>';
}

function render(){
  const app = document.getElementById('app');
  if(screen === 'map') app.innerHTML = renderMap();
  else if(screen === 'practice') app.innerHTML = renderPractice();
  else if(screen === 'summary') app.innerHTML = renderSummary();
}

(function init(){
  loadState();
  render();
})();

</script>
</body>
